<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <!-- Защита от масштабирования на телефонах (чтобы не было зума при двойном клике) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- Запрет индексации в поисковиках -->
  <meta name="robots" content="noindex, nofollow">
  <title>🐆 Игра</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root { --sand: #f5e6c8; --sand-2: #efd9b0; --cocoa: #2c1810; --brown: #8b5a2b; --gold: #d4a373; --cream: #fff8e6; --green: #4caf50; --red: #e53935; }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: 'Fredoka', system-ui, sans-serif; color: var(--cocoa); background: var(--sand);
      min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 16px; position: relative;
      touch-action: manipulation; /* Ускоряет клики на мобилке */
    }
    .leopard-bg {
      position: fixed; inset: 0; z-index: -1; background-color: var(--sand);
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260' viewBox='0 0 260 260'><g fill='%238b5a2b'><circle cx='40' cy='50' r='14'/><circle cx='95' cy='30' r='10'/><circle cx='150' cy='70' r='16'/><circle cx='215' cy='40' r='11'/><circle cx='30' cy='130' r='12'/><circle cx='85' cy='150' r='15'/><circle cx='160' cy='140' r='13'/><circle cx='220' cy='150' r='10'/><circle cx='55' cy='220' r='14'/><circle cx='130' cy='215' r='12'/><circle cx='200' cy='230' r='15'/></g><g fill='%232c1810'><circle cx='40' cy='50' r='7'/><circle cx='95' cy='30' r='5'/><circle cx='150' cy='70' r='8'/><circle cx='215' cy='40' r='6'/><circle cx='30' cy='130' r='6'/><circle cx='85' cy='150' r='7'/><circle cx='160' cy='140' r='7'/><circle cx='220' cy='150' r='5'/><circle cx='55' cy='220' r='7'/><circle cx='130' cy='215' r='6'/><circle cx='200' cy='230' r='8'/></g></svg>");
      background-size: 260px 260px;
    }
    .leopard-bg::after { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at center, transparent 0%, rgba(44, 24, 16, 0.35) 100%); }
    .app { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }
    .hero { text-align: center; }
    .hero h1 { font-size: clamp(1.5rem, 6vw, 2.2rem); line-height: 1.1; text-shadow: 2px 2px 0 var(--gold); margin-bottom: 6px; }
    .subtitle { font-size: 0.85rem; color: var(--cocoa-soft); background: rgba(255,248,230,0.7); padding: 4px 12px; border-radius: 999px; display: inline-block; }
    .card { background: rgba(255, 248, 230, 0.95); border: 3px solid var(--cocoa); border-radius: 16px; padding: 16px; box-shadow: 0 6px 0 rgba(44, 24, 16, 0.85); display: flex; flex-direction: column; gap: 12px; }
    .hidden { display: none !important; }
    .label { font-size: 0.85rem; font-weight: 600; text-transform: uppercase; }
    .input-group { display: flex; gap: 8px; flex-direction: column; }
    input[type="text"] { padding: 14px; border: 3px solid var(--brown); border-radius: 10px; background: var(--cream); font-size: 16px; /* Важно для iOS, чтобы не было зума */ outline: none; width: 100%; }
    button { font-family: inherit; font-weight: 600; font-size: 1rem; cursor: pointer; border: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; touch-action: manipulation; }
    .btn-primary { padding: 14px; background: var(--cocoa); color: var(--cream); border-radius: 10px; box-shadow: 0 4px 0 #1a0e08; width: 100%; }
    .btn-primary:active { transform: translateY(3px); box-shadow: 0 1px 0 #1a0e08; }
    .btn-secondary { padding: 14px; background: var(--gold); color: var(--cocoa); border-radius: 10px; box-shadow: 0 4px 0 var(--brown); width: 100%; }
    .btn-secondary:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--brown); }
    .btn-ghost { padding: 10px; background: transparent; color: var(--cocoa); font-size: 0.9rem; }
    .status { font-size: 0.9rem; color: var(--red); text-align: center; min-height: 1.2em; }
    .hint { font-size: 0.8rem; text-align: center; opacity: 0.8; }
    .room-head { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 0.8rem; }
    .room-badge, .you-badge { font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--cocoa); color: var(--cream); }
    .you-badge { background: var(--gold); color: var(--cocoa); }
    .turn { text-align: center; font-size: 1rem; font-weight: 600; padding: 6px; border-radius: 8px; background: rgba(212,163,115,0.35); }
    .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 8px; background: var(--cocoa); border-radius: 14px; aspect-ratio: 1 / 1; width: 100%; user-select: none; -webkit-user-select: none; }
    .cell { background: var(--cream); border-radius: 8px; font-size: clamp(2rem, 12vw, 3rem); font-weight: 700; color: var(--cocoa); display: flex; align-items: center; justify-content: center; padding: 0; box-shadow: 0 3px 0 var(--brown); }
    .cell.taken { cursor: not-allowed; box-shadow: none; }
    .cell.win { background: var(--green); color: #fff; }
    .result { text-align: center; font-size: 1.1rem; font-weight: 700; min-height: 1.4em; }
    .result.win-msg { color: var(--green); }
    .result.draw-msg { color: var(--brown); }
    @media (min-width: 481px) { .input-group { flex-direction: row; } .btn-primary { width: auto; } }
  </style>
</head>
<body>
  <div class="leopard-bg" aria-hidden="true"></div>
  <main class="app">
    <header class="hero">
      <h1>🐆 Леопардовые<br>крестики-нолики</h1>
      <p class="subtitle">Онлайн игра</p>
    </header>

    <section id="lobby" class="card">
      <label class="label">Комната</label>
      <div class="input-group">
        <input type="text" id="roomInput" placeholder="Имя комнаты" maxlength="20" autocomplete="off">
        <button id="joinBtn" class="btn-primary">Войти</button>
      </div>
      <p id="statusMsg" class="status"></p>
    </section>

    <section id="gameArea" class="card hidden">
      <div class="room-head">
        <span class="room-badge" id="roomLabel">—</span>
        <span class="you-badge" id="youLabel">—</span>
      </div>
      <p id="turnLabel" class="turn">Ход: ❌</p>
      <div class="board" id="board">
        <button class="cell" data-index="0"></button><button class="cell" data-index="1"></button><button class="cell" data-index="2"></button>
        <button class="cell" data-index="3"></button><button class="cell" data-index="4"></button><button class="cell" data-index="5"></button>
        <button class="cell" data-index="6"></button><button class="cell" data-index="7"></button><button class="cell" data-index="8"></button>
      </div>
      <p id="resultMsg" class="result"></p>
      <button id="resetBtn" class="btn-secondary hidden">🔄 Играть снова</button>
      <button id="leaveBtn" class="btn-ghost">← Выйти</button>
    </section>
  </main>

  <!-- Обфусцированный (сжатый) скрипт -->
  <script type="module">
    import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";import{getDatabase,ref,set,onValue,update,off,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
    
    const firebaseConfig={apiKey:"AIzaSyAkgLYaWb7GaRoaGeYNhEFyNUApl8bbyjw",authDomain:"leopard-game-dff83.firebaseapp.com",databaseURL:"https://leopard-game-dff83-default-rtdb.firebaseio.com/",projectId:"leopard-game-dff83",storageBucket:"leopard-game-dff83.firebasestorage.app",messagingSenderId:"200665155506",appId:"1:200665155506:web:8e60f63015e1d66b6906ab"};
    const app=initializeApp(firebaseConfig),db=getDatabase(app);
    const lobby=document.getElementById("lobby"),gameArea=document.getElementById("gameArea"),roomInput=document.getElementById("roomInput"),joinBtn=document.getElementById("joinBtn"),statusMsg=document.getElementById("statusMsg"),roomLabel=document.getElementById("roomLabel"),youLabel=document.getElementById("youLabel"),turnLabel=document.getElementById("turnLabel"),resultMsg=document.getElementById("resultMsg"),resetBtn=document.getElementById("resetBtn"),leaveBtn=document.getElementById("leaveBtn"),cells=document.querySelectorAll(".cell");
    let roomId=null,mySymbol=null,gameRef=null,lastBoard=["","","","","","","","",""],lastWinner=null;
    const WIN_PATTERNS=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    
    joinBtn.addEventListener("click",enterRoom);roomInput.addEventListener("keydown",e=>{if(e.key==="Enter")enterRoom()});
    
    async function enterRoom(){const room=roomInput.value.trim();if(!room){statusMsg.textContent="Введите название";return}roomId=room;mySymbol=null;statusMsg.textContent="Подключение...";gameRef=ref(db,`games/${roomId}`);if(gameRef)off(gameRef);onValue(gameRef,snapshot=>{const data=snapshot.val();if(!data){createNewGame();return}attachToGame(data)});lobby.classList.add("hidden");gameArea.classList.remove("hidden");roomLabel.textContent=`🏠 ${roomId}`}
    async function createNewGame(){mySymbol="X";await set(gameRef,{board:Array(9).fill(""),turn:"X",winner:null,playerX:true,playerO:false,createdAt:serverTimestamp()})}
    function attachToGame(data){if(!mySymbol){if(!data.playerO){mySymbol="O";update(gameRef,{playerO:true})}else{mySymbol="spectator"}youLabel.textContent=mySymbol==="X"?"Вы: ❌":mySymbol==="O"?"Вы: ⭕":"Вы: 👀"}render(data)}
    
    cells.forEach(cell=>{cell.addEventListener("click",()=>{if(!mySymbol||mySymbol==="spectator"||!gameRef)return;onValue(gameRef,snap=>{const data=snap.val();if(!data||data.winner||data.turn!==mySymbol)return;const i=Number(cell.dataset.index);if(data.board[i]!=="")return;const newBoard=[...data.board];newBoard[i]=mySymbol;const winInfo=checkWinner(newBoard);const isDraw=!winInfo&&newBoard.every(c=>c!=="");update(gameRef,{board:newBoard,turn:mySymbol==="X"?"O":"X",winner:winInfo?winInfo.winner:(isDraw?"draw":null)})},{onlyOnce:true})})});
    
    function checkWinner(board){for(const p of WIN_PATTERNS){const[a,b,c]=p;if(board[a]&&board[a]===board[b]&&board[a]===board[c])return{winner:board[a],line:p}}return null}
    
    function render(data){if(!data)return;cells.forEach((cell,i)=>{const val=data.board[i]||"";cell.textContent=val;cell.classList.toggle("taken",val!=="");cell.classList.remove("win")});lastBoard=[...data.board];if(!data.winner){turnLabel.textContent=(data.turn==="X"?"Ход: ❌":"Ход: ⭕")+(mySymbol===data.turn?" — ваш":"");resultMsg.textContent="";resetBtn.classList.add("hidden")}else if(data.winner==="draw"){turnLabel.textContent="Игра окончена";resultMsg.textContent="🤝 Ничья!";resultMsg.className="result draw-msg";resetBtn.classList.remove("hidden")}else{turnLabel.textContent="Игра окончена";resultMsg.textContent=`🏆 Победили ${data.winner==="X"?"❌":"⭕"}!`;resultMsg.className="result win-msg";resetBtn.classList.remove("hidden");const info=checkWinner(data.board);if(info)info.line.forEach(i=>cells[i].classList.add("win"))}lastWinner=data.winner}
    
    resetBtn.addEventListener("click",()=>{if(!gameRef)return;update(gameRef,{board:Array(9).fill(""),turn:"X",winner:null});lastWinner=null});
    leaveBtn.addEventListener("click",()=>{if(gameRef)off(gameRef);roomId=null;mySymbol=null;gameRef=null;lastBoard=["","","","","","","","",""];lastWinner=null;cells.forEach(c=>{c.textContent="";c.className="cell"});resultMsg.textContent="";statusMsg.textContent="";roomInput.value="";gameArea.classList.add("hidden");lobby.classList.remove("hidden")});
  </script>
</body>
</html>
